[package]
name = "sparkmux-desktop"
version = "0.1.67"
edition = "2021"
license = "MIT"
description = "Sparkmux desktop app"
repository = "https://github.com/darrenkoh/sparkmux"
authors = ["Darren Koh"]

[lib]
name = "sparkmux_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sparkmux-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
sparkmux-core = { path = "../../../crates/sparkmux-core" }
tauri = { version = "2.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
arboard = "3"
url = "2"
tauri-plugin-updater = "2"
toml = { workspace = true }
libc = "0.2"
tauri-plugin-notification = "2"
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.7", features = ["set-header"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
rand = "0.8"
subtle = "2"
qrcode = "0.14"
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled"] }

[package]
name = "sparkmux-desktop"
version = "0.1.8"
edition = "2021"
license = "MIT"
description = "Sparkmux desktop app"
repository = "https://github.com/darrenkoh/sparkmux"
authors = ["Darren Koh"]

[lib]
name = "sparkmux_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sparkmux-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
sparkmux-core = { path = "../../../crates/sparkmux-core" }
tauri = { version = "2.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
arboard = "3"

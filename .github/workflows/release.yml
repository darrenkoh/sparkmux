name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-aarch64
          - os: ubuntu-24.04-arm
            name: linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            pkg-config \
            tmux
      - name: Frontend deps
        working-directory: apps/desktop
        run: npm ci
      - name: Build (workflow dispatch)
        if: github.event_name == 'workflow_dispatch'
        working-directory: apps/desktop
        run: npm run tauri build
      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sparkmux-${{ matrix.name }}
          path: |
            target/release/bundle/macos/*.app
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/sparkmux
            target/release/sparkmux-desktop
          if-no-files-found: warn
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Sparkmux ${{ github.ref_name }}
          releaseBody: |
            Desktop app for Apple Silicon macOS and ARM64 Linux.

            **Requires tmux 3.2+** (`brew install tmux` / `sudo apt install tmux`).
            Sparkmux uses `-L sparkmux` only; your default tmux server is never touched.

            macOS builds are unsigned. Right-click Sparkmux.app → Open.
          releaseDraft: false
          prerelease: false

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checkout only. Cache access stays on the workflow's cache-mode, not this token.
permissions:
  contents: read

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: macOS tmux
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Linux tmux and WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            tmux \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            libxdo-dev \
            build-essential
      # rust-embed compiles apps/desktop/dist into the binary. That folder is
      # gitignored and produced by Vite; cargo test only needs the manifest
      # and index.html that the web server tests request.
      - name: Stage web dist for rust-embed
        run: |
          mkdir -p apps/desktop/dist
          cp apps/desktop/public/manifest.webmanifest apps/desktop/dist/manifest.webmanifest
          printf '%s\n' '<!doctype html><html><head><title>Sparkmux</title></head><body></body></html>' > apps/desktop/dist/index.html
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
